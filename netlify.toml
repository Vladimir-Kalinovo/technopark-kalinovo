# Конфигурация Netlify для сайта «Технопарк Калиново».
# Деплой через подключённый GitHub-репозиторий: Netlify сам ставит зависимости
# (package.json) и собирает функции из netlify/functions.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Канонический адрес главной: /index.html → / (301).
# force = true нужен, потому что файл index.html реально существует.
# Правило срабатывает только на путь /index.html — запросы к "/" (включая
# POST формы Netlify и fetch каталога) не затрагиваются; query-строка сохраняется.
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

# Админка остаётся в SPA на index.html (без публичной ссылки в футере)
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/index.html"
  status = 200

# Старые hash-URL поисковиками почти не открываются как путь;
# на всякий случай нормализуем частые пути без trailing slash
[[redirects]]
  from = "/o-kompanii"
  to = "/o-kompanii/"
  status = 301

[[redirects]]
  from = "/contacts"
  to = "/contacts/"
  status = 301

[[redirects]]
  from = "/usloviya-arendy"
  to = "/usloviya-arendy/"
  status = 301

[[redirects]]
  from = "/arenda-pomeshcheniya-pod-sklad"
  to = "/arenda-pomeshcheniya-pod-sklad/"
  status = 301

[[redirects]]
  from = "/arenda-pomeshcheniya-pod-proizvodstvo"
  to = "/arenda-pomeshcheniya-pod-proizvodstvo/"
  status = 301

# Заголовки безопасности для всех страниц
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# HTML — без агрессивного кэша, чтобы правки появлялись сразу
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Фотографии — кэшируем надолго (они статичны)
[[headers]]
  for = "/*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000"
